# Local development services for DiscoBall.
#
#   docker compose up -d        # PostgreSQL + the PDF render service (default)
#   docker compose up -d db     # just PostgreSQL
#
services:
  db:
    image: postgres:16-alpine
    container_name: discoball-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: discoball
      POSTGRES_PASSWORD: discoball
      POSTGRES_DB: discoball
    ports:
      - "5432:5432"
    volumes:
      - discoball-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discoball -d discoball"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Headless LibreOffice/Gotenberg for DOCX -> PDF conversion. Bundled from the
  # start (ADR-0007); the app reaches it via PDF_RENDER_URL=http://localhost:3001.
  pdf:
    image: gotenberg/gotenberg:8
    container_name: discoball-pdf
    restart: unless-stopped
    ports:
      - "3001:3000"

volumes:
  discoball-pgdata:
